name: Feature request
description: Suggest an improvement for PersonalFinanceManager
title: "Feature: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please keep examples sanitized. Do not include real account numbers, exports, statements, or private financial details.
  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow
      description: What workflow would this improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should PersonalFinanceManager do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional.
