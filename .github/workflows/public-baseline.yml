name: Public Baseline Verification

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify public baseline
        shell: pwsh
        env:
          PFM_UI_PREVIEW_DIRECTORY: ${{ github.workspace }}/TestResults/Screenshots
        run: ./scripts/verify-public-baseline.ps1 -SkipPackage
      - name: Upload desktop UI previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-ui-previews
          path: 'TestResults/Screenshots/*.png'
          if-no-files-found: error
          retention-days: 7
